name: Couples75
options:
  bundleIdPrefix: com.dinismagina
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_PREVIEWS: YES
targets:
  App:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
      - path: Shared
      - path: App/Products.storekit
        buildPhase: none
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dinismagina.couples75
        PRODUCT_NAME: "Couples 75"
        PRODUCT_MODULE_NAME: Couples75
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    dependencies:
      - target: Widgets
        embed: true
  Widgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
      - path: App/Sources/Design/Theme.swift
      - path: App/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dinismagina.couples75.widgets
        PRODUCT_NAME: Widgets
        CODE_SIGN_ENTITLEMENTS: Widgets/Widgets.entitlements
        INFOPLIST_FILE: Widgets/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO
        SKIP_INSTALL: YES
  AppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dinismagina.couples75.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Couples 75.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Couples 75"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  App:
    build:
      targets:
        App: all
        Widgets: all
        AppTests: [test]
    run:
      config: Debug
      storeKitConfiguration: App/Products.storekit
      commandLineArguments:
        "-mock": false
    test:
      config: Debug
      targets:
        - AppTests
    archive:
      config: Release
